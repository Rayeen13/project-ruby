[package]
name = "project-ruby"
version = "0.5.4"
description = "Project Ruby desktop companion prototype"
authors = ["Project Ruby contributors"]
license = "GPL-2.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "macros"] }
sha2 = "0.10"
zip = { version = "=9.0.3", default-features = false, features = ["deflate"] }

roxmltree = "0.20"

bzip2 = "0.5"
tar = "0.4"

base64 = "=0.22.1"
