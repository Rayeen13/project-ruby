name: Windows desktop build
on:
  pull_request:
    paths: ['src-tauri/**', 'scripts/native-smoke.js', 'scripts/windows-smoke.ps1', 'scripts/windows-voice-smoke.ps1', 'dist/**', 'package.json', 'package-lock.json', '.github/workflows/windows-shell.yml']
  push:
    branches: [main, 'release/**']
    paths: ['src-tauri/**', 'scripts/native-smoke.js', 'scripts/windows-smoke.ps1', 'scripts/windows-voice-smoke.ps1', 'dist/**', 'package.json', 'package-lock.json', '.github/workflows/windows-shell.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    name: Native formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lock_ready: ${{ steps.lock-state.outputs.tracked }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Prepare reproducible application dependency lock
        id: lock-state
        shell: bash
        run: |
          if git ls-files --error-unmatch src-tauri/Cargo.lock >/dev/null 2>&1; then
            echo 'tracked=true' >> "$GITHUB_OUTPUT"
          else
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
            echo 'tracked=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain initial lock for source review
        if: steps.lock-state.outputs.tracked == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ruby-cargo-lock
          path: src-tauri/Cargo.lock
          retention-days: 7
  windows:
    name: Windows x64 installer
    needs: format
    if: needs.format.outputs.lock_ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --bin project-ruby
      - run: npm run desktop:build -- --bundles nsis
      - run: npm run check:assets
      - name: Capture and validate actual avatar visuals before AI downloads
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -VisualOnly
      - name: Retain avatar visual review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: opal-visual-review
          path: |
            ruby-native-opal_*.png
            ruby-native-dizzy_*.png
            ruby-native-workspace_*.png
            ruby-native-prism_*.png
            ruby-native-smoke.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Restore verified VoiceM download cache
        id: voice-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/AppData/Local/io.github.rayeen13.projectruby/kokoro-smoke-v1
          key: windows-ruby-kokoro-v1-int8-sherpa-1.12.15
      - name: Verify offline English, Chinese and Japanese synthesis independently
        shell: pwsh
        run: ./scripts/windows-voice-smoke.ps1
      - name: Restore verified anime VoiceM cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/AppData/Local/io.github.rayeen13.projectruby/irodori-smoke-v1
          key: windows-irodori-mf-q4-1913bf74-speech-0810
      - name: Verify actual native anime VoiceM lifecycle
        shell: pwsh
        run: ./scripts/windows-voice-smoke.ps1 -AnimeOnly
      - name: Exercise actual Windows WebView and native window
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/windows-smoke.ps1
      - name: Check completed VoiceM cache
        id: voice-cache-ready
        if: always()
        shell: pwsh
        run: |
          $marker = Join-Path $env:LOCALAPPDATA 'io.github.rayeen13.projectruby/kokoro-smoke-v1/installed-kokoro-v1'
          if (Test-Path $marker) { 'ready=true' | Out-File $env:GITHUB_OUTPUT -Append }
      - name: Save completed VoiceM assets
        if: always() && steps.voice-cache-ready.outputs.ready == 'true' && steps.voice-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/AppData/Local/io.github.rayeen13.projectruby/kokoro-smoke-v1
          key: windows-ruby-kokoro-v1-int8-sherpa-1.12.15
      - name: Retain failed native evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ruby-native-failure-evidence
          path: ruby-native-*
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare preview download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path desktop-artifact -Force | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe desktop-artifact/
          Copy-Item src-tauri/target/release/project-ruby.exe desktop-artifact/
          Copy-Item LICENSE desktop-artifact/
          Copy-Item dist/vendor/THREE-LICENSE.txt,dist/vendor/THREE-VRM-LICENSE.txt desktop-artifact/
          Copy-Item docs/OPAL_ASSET.md desktop-artifact/
          Copy-Item docs/licenses/REQWEST-MIT.txt desktop-artifact/
          Copy-Item docs/licenses/ZIP-MIT.txt desktop-artifact/
          Copy-Item docs/WINDOWS.md desktop-artifact/README.md
          Copy-Item docs/HUMANOID_GESTURES.md,docs/PRISMY_STUDIO_BLUEPRINT.md,docs/VOICE_M_IRODORI.md,docs/OPAL_WARDROBE.md desktop-artifact/
          Copy-Item src-tauri/Cargo.lock desktop-artifact/
          Copy-Item ruby-native-smoke.txt desktop-artifact/
          Copy-Item ruby-native-*.wav,ruby-native-voice.txt desktop-artifact/
          Copy-Item docs/licenses/SUPERTONIC3-OPENRAIL-M.txt desktop-artifact/
          Copy-Item ruby-native-menu.png,ruby-native-float.png,ruby-native-dizzy.png,ruby-native-chat.png,ruby-native-chat_lab.png,ruby-native-setup.png,ruby-native-opal.png,ruby-native-languages.png,ruby-native-voice_library.png,ruby-native-workspace_ametrine.png,ruby-native-workspace_obsidian.png,ruby-native-workspace_sakura.png,ruby-native-workspace_cyberpunk.png,ruby-native-prism_review.png,ruby-native-prism_active.png desktop-artifact/
          Copy-Item ruby-native-carry.txt,ruby-native-pin.txt,ruby-native-zoom.txt,ruby-native-frame.txt desktop-artifact/
          Copy-Item ruby-native-opal_*.png,ruby-native-dizzy_*.png desktop-artifact/
          Copy-Item ruby-native-left.png,ruby-native-right.png,ruby-native-zoom_view.png desktop-artifact/
          Get-ChildItem desktop-artifact/*.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File desktop-artifact/SHA256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-ruby-windows-x64-preview
          path: desktop-artifact/
          if-no-files-found: error
          retention-days: 30
